/* ============================================================
   Poneglyph DESIGN TOKENS — single source of truth
   ------------------------------------------------------------
   This file is the single source of the Poneglyph HTML design
   system: the report family, the dashboard family and the dynamic
   theme (scripts/theme.ts) all read their colors, type, spacing
   and radius from here. Change a value here and nowhere else.

   NAMES: the v2 short names (--bg, --surface, --ink, --line,
   --accent, --good, --t-*). Extras the report family needs:
   --accent-bd, --line-soft, --info-bg/-bd (the info callout,
   read with --link), --{blocker,major,minor,nit,ok}-bg and -bd,
   --shadow-hover, --lh-*, --space-*, --radius-*.

   CONTRAST: every text token reaches WCAG AA 4.5:1 on --bg,
   --surface and --surface-2, every severity reaches it on its own
   -bg tint and --link reaches it on --info-bg, in light and in
   dark (scripts/tokens.test.ts). Light accent and status colors
   are darkened only as far as AA requires; surfaces, lines, ink
   and every other dark value are v2.

   BLOCKS: light at :root; dark at html[data-theme="dark"] and,
   for no-JS visitors, under prefers-color-scheme with
   html:not([data-theme]); light again under @media print. The two
   dark blocks and the print block repeat values on purpose, and
   the test fails when a pair drifts. The print block is last so
   it beats both dark selectors.

   SEVERITY (5: blocker|major|minor|nit|ok) tags findings.
   SCORE   (4: bad|warn|mid|good) tags numbers. NOT interchangeable.

   LAYOUT: --maxw is not a token; each template sets its own.
============================================================ */

/* ---- LIGHT: clean cool-neutral, deep teal ---- */
:root {
  --bg:#f3f5f9; --surface:#ffffff; --surface-2:#e9eef5;
  --line:#d9e0ea; --line-soft:#e4e9f1; --line-strong:#bcc6d4;
  --ink:#0f1620; --ink-2:#404a59; --ink-3:#5d6776;
  --accent:#0b786e; --accent-2:#0f766e; --accent-bg:#dcf5f0; --accent-bd:#a9dcd3; --link:#0e7490;
  --info-bg:#e6f4f8; --info-bd:#b4dbe6;
  --good:#117b38; --mid:#906303; --warn:#b9460a; --bad:#d12222;
  --blocker:#d12222; --blocker-bg:#fef2f2; --blocker-bd:#f6c9c9;
  --major:#b9460a;   --major-bg:#fff4ec;   --major-bd:#f8cfae;
  --minor:#906303;   --minor-bg:#fdf8e7;   --minor-bd:#ecd9a0;
  --nit:#5e6d82;     --nit-bg:#eef2f7;     --nit-bd:#d3dbe6;
  --ok:#117b38;      --ok-bg:#edf7ee;      --ok-bd:#b9e2bf;
  --track:rgba(15,22,32,.08);
  --serif:"Newsreader","Iowan Old Style",Palatino,Georgia,serif;
  --sans:"Geist",ui-sans-serif,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Consolas,monospace;
  --shadow:0 1px 2px rgba(17,22,29,.08),0 8px 24px rgba(17,22,29,.10);
  --shadow-hover:0 4px 12px rgba(17,22,29,.12),0 12px 36px rgba(17,22,29,.12);
}

/* ---- Scales (theme-independent) ---- */
:root {
  --t-xs:.75rem; --t-sm:.8125rem; --t-base:.9375rem; --t-md:1.0625rem;
  --t-lg:1.375rem; --t-xl:1.75rem; --t-2xl:2.25rem; --t-3xl:clamp(2.1rem,5vw,3.2rem);
  --lh-tight:1.2; --lh-snug:1.35; --lh-normal:1.6;
  --space-1:.25rem; --space-2:.5rem; --space-3:.75rem; --space-4:1rem;
  --space-5:1.5rem; --space-6:2rem; --space-7:3rem; --space-8:4rem;
  --radius-sm:6px; --radius-md:10px; --radius-lg:16px; --radius-full:9999px;
}

/* ---- DARK: deep blue-black, vivid teal, lively data ---- */
html[data-theme="dark"] {
  --bg:#0a0e1a; --surface:#1a2236; --surface-2:#232e48;
  --line:#33415f; --line-soft:#29344f; --line-strong:#475a7e;
  --ink:#eef1f6; --ink-2:#c4ccda; --ink-3:#959fb1;
  --accent:#2dd4bf; --accent-2:#5eead4; --accent-bg:#0e3330; --accent-bd:#14534c; --link:#38bdf8;
  --info-bg:#0c2436; --info-bd:#16425c;
  --good:#34d399; --mid:#fbbf24; --warn:#fb923c; --bad:#f87171;
  --blocker:#f87171; --blocker-bg:#2c1212; --blocker-bd:#5c1f1f;
  --major:#fb923c;   --major-bg:#2a1808;   --major-bd:#5a3411;
  --minor:#fbbf24;   --minor-bg:#261f08;   --minor-bd:#524212;
  --nit:#94a3b8;     --nit-bg:#1f2a40;     --nit-bd:#3a4869;
  --ok:#34d399;      --ok-bg:#0e2415;      --ok-bd:#1d4d2c;
  --track:rgba(255,255,255,.06);
  --shadow:0 1px 2px rgba(0,0,0,.55),0 12px 32px rgba(0,0,0,.5);
  --shadow-hover:0 4px 12px rgba(0,0,0,.6),0 16px 40px rgba(0,0,0,.55);
}

/* ---- No-JS fallback: honor OS preference (same values as the dark block) ---- */
@media (prefers-color-scheme: dark) {
  html:not([data-theme]) {
    --bg:#0a0e1a; --surface:#1a2236; --surface-2:#232e48;
    --line:#33415f; --line-soft:#29344f; --line-strong:#475a7e;
    --ink:#eef1f6; --ink-2:#c4ccda; --ink-3:#959fb1;
    --accent:#2dd4bf; --accent-2:#5eead4; --accent-bg:#0e3330; --accent-bd:#14534c; --link:#38bdf8;
    --info-bg:#0c2436; --info-bd:#16425c;
    --good:#34d399; --mid:#fbbf24; --warn:#fb923c; --bad:#f87171;
    --blocker:#f87171; --blocker-bg:#2c1212; --blocker-bd:#5c1f1f;
    --major:#fb923c;   --major-bg:#2a1808;   --major-bd:#5a3411;
    --minor:#fbbf24;   --minor-bg:#261f08;   --minor-bd:#524212;
    --nit:#94a3b8;     --nit-bg:#1f2a40;     --nit-bd:#3a4869;
    --ok:#34d399;      --ok-bg:#0e2415;      --ok-bd:#1d4d2c;
    --track:rgba(255,255,255,.06);
    --shadow:0 1px 2px rgba(0,0,0,.55),0 12px 32px rgba(0,0,0,.5);
    --shadow-hover:0 4px 12px rgba(0,0,0,.6),0 16px 40px rgba(0,0,0,.55);
  }
}

/* ---- PRINT: paper is light whatever the screen theme (same values as :root) ---- */
@media print {
  :root, html[data-theme], html:not([data-theme]) {
    --bg:#f3f5f9; --surface:#ffffff; --surface-2:#e9eef5;
    --line:#d9e0ea; --line-soft:#e4e9f1; --line-strong:#bcc6d4;
    --ink:#0f1620; --ink-2:#404a59; --ink-3:#5d6776;
    --accent:#0b786e; --accent-2:#0f766e; --accent-bg:#dcf5f0; --accent-bd:#a9dcd3; --link:#0e7490;
    --info-bg:#e6f4f8; --info-bd:#b4dbe6;
    --good:#117b38; --mid:#906303; --warn:#b9460a; --bad:#d12222;
    --blocker:#d12222; --blocker-bg:#fef2f2; --blocker-bd:#f6c9c9;
    --major:#b9460a;   --major-bg:#fff4ec;   --major-bd:#f8cfae;
    --minor:#906303;   --minor-bg:#fdf8e7;   --minor-bd:#ecd9a0;
    --nit:#5e6d82;     --nit-bg:#eef2f7;     --nit-bd:#d3dbe6;
    --ok:#117b38;      --ok-bg:#edf7ee;      --ok-bd:#b9e2bf;
    --track:rgba(15,22,32,.08);
    --shadow:0 1px 2px rgba(17,22,29,.08),0 8px 24px rgba(17,22,29,.10);
    --shadow-hover:0 4px 12px rgba(17,22,29,.12),0 12px 36px rgba(17,22,29,.12);
  }
}

    /* Layout width is per template, not a token. */
    :root { --maxw: 1080px; }

    /* ============================================================
       RESET & BASE
    ============================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { font-size: 16px; scroll-behavior: smooth; }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--ink);
      line-height: var(--lh-normal);
      font-size: var(--t-base);
      min-height: 100vh;
      /* two-column reading layout: sticky TOC + main column */
      display: grid;
      grid-template-columns: 240px minmax(0, var(--maxw));
      grid-template-areas:
        "header header"
        "toc    main"
        "footer footer";
      column-gap: var(--space-7);
      justify-content: center;
      align-items: start;
      padding: var(--space-6) var(--space-4) var(--space-8);
    }

    a { color: var(--link); }

    /* ============================================================
       C8 — metadata-header (report title strip)
    ============================================================ */
    .report-header {
      grid-area: header;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 2.5rem 2.5rem 2rem;
      margin-bottom: var(--space-5);
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }
    .report-header::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: var(--accent); /* single teal hairline — editorial restraint */
    }
    .report-meta {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }
    .kicker {
      font-size: var(--t-xs);
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-bg);
      border: 1px solid var(--accent-bd);
      padding: 0.25rem 0.625rem;
      border-radius: var(--radius-full);
    }
    .report-mode {
      font-size: var(--t-xs);
      font-weight: 600;
      font-family: var(--mono);
      color: var(--ink-2);
      background: var(--surface-2);
      border: 1px solid var(--line);
      padding: 0.25rem 0.625rem;
      border-radius: var(--radius-full);
    }
    .report-date {
      font-size: var(--t-sm);
      color: var(--ink-3);
      margin-left: auto;
      font-variant-numeric: tabular-nums;
    }
    .report-title {
      font-family: var(--serif);
      font-size: clamp(1.6rem, 3vw, var(--t-2xl));
      font-weight: 600;
      line-height: var(--lh-tight);
      letter-spacing: -0.01em;
      color: var(--ink);
      margin-bottom: 0.5rem;
    }
    .report-subtitle {
      font-size: var(--t-base);
      color: var(--ink-2);
      margin-bottom: 1.25rem;
    }
    .report-badges {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      flex-wrap: wrap;
    }
    .verdict-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.375rem 0.875rem;
      border-radius: var(--radius-full);
      font-size: var(--t-xs);
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .verdict-badge::before {
      content: '';
      width: 7px; height: 7px;
      border-radius: 50%;
      background: currentColor;
    }
    .verdict--ok      { color: var(--ok);      background: var(--ok-bg);      border: 1px solid var(--ok-bd); }
    .verdict--minor   { color: var(--minor);   background: var(--minor-bg);   border: 1px solid var(--minor-bd); }
    .verdict--major   { color: var(--major);   background: var(--major-bg);   border: 1px solid var(--major-bd); }
    .verdict--blocker { color: var(--blocker); background: var(--blocker-bg); border: 1px solid var(--blocker-bd); }
    .meta-chip {
      display: inline-flex;
      align-items: center;
      font-size: var(--t-xs);
      font-weight: 600;
      color: var(--ink-2);
      background: var(--surface-2);
      border: 1px solid var(--line);
      padding: 0.3rem 0.6rem;
      border-radius: var(--radius-full);
    }
    .meta-chip code { font-family: var(--mono); font-size: 0.92em; }

    /* ============================================================
       TOC SIDEBAR (sticky; collapses to top <details> on mobile)
    ============================================================ */
    .toc {
      grid-area: toc;
      position: sticky;
      top: var(--space-6);
      align-self: start;
      max-height: calc(100vh - var(--space-7));
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 1.25rem 1.25rem;
      box-shadow: var(--shadow);
      font-size: var(--t-sm);
    }
    .toc-title {
      font-size: var(--t-xs);
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-2);
      margin-bottom: 0.75rem;
    }
    .toc nav ol { list-style: none; display: flex; flex-direction: column; gap: 0.15rem; counter-reset: toc; }
    .toc nav a {
      display: block;
      padding: 0.35rem 0.5rem;
      border-radius: var(--radius-sm);
      color: var(--ink-2);
      text-decoration: none;
      border-left: 2px solid transparent;
      line-height: var(--lh-snug);
    }
    .toc nav a:hover { background: var(--accent-bg); color: var(--accent); }
    /* CSS-only active section via :target — no JS */
    section[id]:target ~ * { /* no-op anchor for smooth scroll */ }
    .toc summary { display: none; } /* hidden on desktop; shown on mobile */

    /* ============================================================
       MAIN COLUMN
    ============================================================ */
    main {
      grid-area: main;
      min-width: 0;
    }

    /* C7 — section-header (numbered + anchor + trailing rule) */
    .section-header {
      font-family: var(--serif);
      font-size: var(--t-lg);
      font-weight: 600;
      line-height: var(--lh-snug);
      color: var(--ink);
      margin: var(--space-7) 0 var(--space-4);
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
      scroll-margin-top: var(--space-5);
    }
    .section-header:first-of-type { margin-top: var(--space-2); }
    .section-num {
      font-family: var(--mono);
      font-size: var(--t-sm);
      font-weight: 700;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }
    .section-header::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--line);
      align-self: center;
    }
    .section-anchor {
      opacity: 0;
      color: var(--ink-3);
      text-decoration: none;
      font-family: var(--mono);
      transition: opacity 0.15s ease;
      align-self: center;
    }
    .section-header:hover .section-anchor { opacity: 1; }

    section { margin-bottom: var(--space-6); }

    /* Readable measure for prose; cards/tables may go full width */
    main p, main ul:not(.sev-legend):not(.stat-grid), main ol { max-width: 72ch; }
    main p { margin-bottom: var(--space-4); color: var(--ink); }
    main .lead { font-size: var(--t-md); color: var(--ink); }
    main ul, main ol { margin: 0 0 var(--space-4) 1.25rem; }
    main li { margin-bottom: 0.4rem; line-height: var(--lh-normal); }
    main strong { font-weight: 700; }
    main code, main .mono { font-family: var(--mono); font-size: 0.9em; }
    main code {
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 0.08em 0.36em;
    }

    /* ============================================================
       C1 — score-gauge (radial SVG, N/10)
    ============================================================ */
    .gauge {
      position: relative;
      width: 140px;
      height: 140px;
      flex-shrink: 0;
    }
    .gauge svg { display: block; width: 100%; height: 100%; }
    .gauge-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .gauge-value {
      font-family: var(--serif);
      font-size: var(--t-xl);
      font-weight: 600;
      line-height: 1;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }
    .gauge-max {
      font-size: var(--t-sm);
      color: var(--ink-2);
      font-variant-numeric: tabular-nums;
    }
    .gauge-label {
      margin-top: 0.25rem;
      font-size: var(--t-xs);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-2);
    }

    /* ============================================================
       C5 — stat-tile + severity-bar
    ============================================================ */
    .stat-grid {
      list-style: none;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: var(--space-3);
      margin: 0;
    }
    .stat-tile {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 0.875rem 1rem;
    }
    .stat-value {
      font-family: var(--serif);
      font-size: var(--t-2xl);
      font-weight: 600;
      line-height: 1.05;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }
    .stat-label {
      font-size: var(--t-xs);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--ink-2);
    }

    .sev-bar {
      display: flex;
      height: 14px;
      border-radius: var(--radius-full);
      overflow: hidden;
      background: var(--surface-2);
      border: 1px solid var(--line);
    }
    .sev-seg { height: 100%; }
    .sev-seg.sev--blocker { background: var(--blocker); }
    .sev-seg.sev--major   { background: var(--major); }
    .sev-seg.sev--minor   { background: var(--minor); }
    .sev-seg.sev--nit     { background: var(--nit); }
    .sev-legend {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-4);
      margin: var(--space-3) 0 0;
      padding: 0;
      font-size: var(--t-sm);
      color: var(--ink-2);
    }
    .sev-legend li { display: flex; align-items: center; gap: 0.4rem; margin: 0; }
    .sev-legend .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .dot.sev--blocker { background: var(--blocker); }
    .dot.sev--major   { background: var(--major); }
    .dot.sev--minor   { background: var(--minor); }
    .dot.sev--nit     { background: var(--nit); }
    .dot.sev--ok      { background: var(--ok); }

    /* ============================================================
       C4 — callout (note / warn / info)
    ============================================================ */
    .callout {
      display: flex;
      gap: var(--space-3);
      align-items: flex-start;
      border-radius: var(--radius-md);
      padding: 1rem 1.25rem;
      margin: 0 0 var(--space-4);
      max-width: 72ch;
      border-left: 4px solid var(--accent);
      background: var(--accent-bg);
    }
    .callout-icon {
      width: 22px; height: 22px;
      border-radius: var(--radius-full);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem;
      font-weight: 800;
      font-style: normal;
      flex-shrink: 0;
      color: var(--surface);
      background: var(--accent);
      margin-top: 0.05rem;
    }
    .callout-body { font-size: var(--t-base); color: var(--ink); line-height: var(--lh-normal); }
    .callout-body p { margin: 0; }
    .callout--note { border-left-color: var(--accent); background: var(--accent-bg); }
    .callout--note .callout-icon { background: var(--accent); }
    .callout--info { border-left-color: var(--link); background: var(--info-bg); }
    .callout--info .callout-icon { background: var(--link); }
    .callout--warn { border-left-color: var(--major); background: var(--major-bg); }
    .callout--warn .callout-icon { background: var(--major); }

    /* ============================================================
       C2 — data-table (zebra + severity rows + score pills)
    ============================================================ */
    .table-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      overflow-x: auto; /* a wide table scrolls on mobile, never clips */
      box-shadow: var(--shadow);
      margin-bottom: var(--space-5);
    }
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: var(--t-sm);
    }
    .data-table th {
      padding: 0.7rem 1rem;
      text-align: left;
      font-size: var(--t-xs);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-2);
      background: var(--surface-2);
      border-bottom: 1px solid var(--line-strong);
      position: sticky;
      top: 0;
    }
    .data-table th.num, .data-table td.num {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .data-table td {
      padding: 0.7rem 1rem;
      vertical-align: top;
      border-bottom: 1px solid var(--line);
      color: var(--ink);
      line-height: var(--lh-snug);
    }
    .data-table td.mono { font-family: var(--mono); font-size: 0.9em; color: var(--ink-2); }
    .data-table tbody tr:nth-child(even) td { background: var(--surface-2); }
    .data-table tbody tr:hover td { background: var(--accent-bg); }
    .data-table tr:last-child td { border-bottom: none; }

    /* score-pill inline chip (score threshold, not severity) */
    .score-pill {
      display: inline-block;
      min-width: 1.6rem;
      text-align: center;
      padding: 0.1rem 0.45rem;
      border-radius: var(--radius-full);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      font-size: var(--t-sm);
    }
    .score-pill.score--bad  { color: var(--surface); background: var(--bad); }
    .score-pill.score--warn { color: var(--surface); background: var(--warn); }
    .score-pill.score--mid  { color: var(--surface); background: var(--mid); }
    .score-pill.score--good { color: var(--surface); background: var(--good); }

    /* severity row mode (findings table): left rule + faint tint */
    .data-table tr.sev-row td { border-left: 3px solid transparent; }
    .data-table tr.sev-row.sev--blocker td:first-child { box-shadow: inset 3px 0 0 var(--blocker); }
    .data-table tr.sev-row.sev--major   td:first-child { box-shadow: inset 3px 0 0 var(--major); }
    .data-table tr.sev-row.sev--minor   td:first-child { box-shadow: inset 3px 0 0 var(--minor); }
    .data-table tr.sev-row.sev--nit     td:first-child { box-shadow: inset 3px 0 0 var(--nit); }

    /* sev-badge — reusable severity pill (findings, cells) */
    .sev-badge {
      display: inline-block;
      padding: 0.12rem 0.5rem;
      border-radius: var(--radius-full);
      font-size: var(--t-xs);
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .sev-badge.sev--blocker { color: var(--blocker); background: var(--blocker-bg); border: 1px solid var(--blocker-bd); }
    .sev-badge.sev--major   { color: var(--major);   background: var(--major-bg);   border: 1px solid var(--major-bd); }
    .sev-badge.sev--minor   { color: var(--minor);   background: var(--minor-bg);   border: 1px solid var(--minor-bd); }
    .sev-badge.sev--nit     { color: var(--nit);     background: var(--nit-bg);     border: 1px solid var(--nit-bd); }
    .sev-badge.sev--ok      { color: var(--ok);      background: var(--ok-bg);      border: 1px solid var(--ok-bd); }

    /* ============================================================
       C3 — finding-card (severity left-border + action)
    ============================================================ */
    .finding-grid {
      list-style: none;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: var(--space-5);
      margin: 0 0 var(--space-5);
    }
    .finding-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-left-width: 4px;
      border-radius: var(--radius-lg);
      padding: 1.25rem 1.5rem;
      box-shadow: var(--shadow);
      transition: box-shadow 0.2s ease, transform 0.2s ease;
    }
    .finding-card:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); }
    .finding-card.sev--blocker { border-left-color: var(--blocker); }
    .finding-card.sev--major   { border-left-color: var(--major); }
    .finding-card.sev--minor   { border-left-color: var(--minor); }
    .finding-card.sev--nit     { border-left-color: var(--nit); }
    .finding-head { display: flex; align-items: center; gap: var(--space-2); margin-bottom: 0.625rem; flex-wrap: wrap; }
    .finding-meta { font-size: var(--t-xs); color: var(--ink-2); }
    .finding-title {
      font-family: var(--serif);
      font-size: var(--t-md);
      font-weight: 600;
      line-height: var(--lh-snug);
      margin-bottom: 0.625rem;
    }
    .finding-action { font-size: var(--t-sm); color: var(--ink-2); margin-bottom: 0.625rem; }
    .finding-action-label {
      font-size: var(--t-xs);
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent);
      margin-right: 0.4rem;
    }
    .finding-flow {
      display: inline-block;
      font-family: var(--mono);
      font-size: var(--t-xs);
      color: var(--ink-2);
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 0.25rem 0.5rem;
    }

    /* ============================================================
       C6 — progress-bar (horizontal score / AC compliance)
    ============================================================ */
    .pbar-row { display: flex; align-items: center; gap: var(--space-3); margin-bottom: 0.5rem; max-width: 72ch; }
    .pbar-name { flex: 0 0 11rem; font-size: var(--t-sm); color: var(--ink-2); }
    .pbar {
      flex: 1;
      height: 8px;
      background: var(--track);
      border-radius: var(--radius-full);
      overflow: hidden;
    }
    .pbar-fill { height: 100%; border-radius: var(--radius-full); }
    .pbar-fill.score--bad  { background: var(--bad); }
    .pbar-fill.score--warn { background: var(--warn); }
    .pbar-fill.score--mid  { background: var(--mid); }
    .pbar-fill.score--good { background: var(--good); }
    .pbar-num { flex: 0 0 2.5rem; text-align: right; font-size: var(--t-sm); font-variant-numeric: tabular-nums; color: var(--ink); }

    @media (prefers-reduced-motion: no-preference) {
      .pbar-fill { animation: pbar-grow 0.8s ease-out; }
      @keyframes pbar-grow { from { width: 0 !important; } }
    }

    /* exec-summary hero band */
    .exec-hero {
      display: flex;
      gap: var(--space-6);
      align-items: center;
      flex-wrap: wrap;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 1.75rem 2rem;
      margin-bottom: var(--space-5);
      box-shadow: var(--shadow);
    }
    .exec-hero-stats { flex: 1; min-width: 260px; display: flex; flex-direction: column; gap: var(--space-4); }

    /* ============================================================
       FOOTER
    ============================================================ */
    footer.report-footer {
      grid-area: footer;
      text-align: center;
      font-size: var(--t-sm);
      color: var(--ink-3);
      margin-top: var(--space-6);
      padding-top: var(--space-4);
      border-top: 1px solid var(--line);
    }
    footer.report-footer code { font-family: var(--mono); }

    /* ============================================================
       RESPONSIVE — collapse to single column under 880px
    ============================================================ */
    @media (max-width: 880px) {
      body {
        grid-template-columns: minmax(0, 1fr);
        grid-template-areas:
          "header"
          "toc"
          "main"
          "footer";
        column-gap: 0;
      }
      .toc {
        position: static;
        max-height: none;
        margin-bottom: var(--space-5);
      }
      .toc summary {
        display: block;
        cursor: pointer;
        font-size: var(--t-xs);
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--ink-2);
      }
      .toc .toc-title { display: none; }
      details.toc[open] summary { margin-bottom: 0.75rem; }
    }

    @media (max-width: 600px) {
      body { padding: var(--space-4) var(--space-3) var(--space-7); }
      .report-header { padding: 1.75rem 1.25rem 1.5rem; }
      .data-table th, .data-table td { padding: 0.55rem 0.7rem; }
      .exec-hero { flex-direction: column; align-items: stretch; }
    }

    /* ============================================================
       PRINT
    ============================================================ */
    @media print {
      body {
        display: block;
        padding: 0;
      }
      .toc { display: none; }
      main { max-width: 100%; }
      .report-header, .table-card, .finding-card, .callout, .exec-hero,
      .stat-tile { box-shadow: none; }
      .finding-card:hover { transform: none; }
      .pbar-fill { animation: none; }
      .table-card, .finding-card, .callout, section { break-inside: avoid; }
      .section-header { break-after: avoid; }
      a[href^="http"]::after { content: " (" attr(href) ")"; font-size: 0.85em; color: var(--ink-3); }
    }
  </style>
</head>
<body>

  <!-- =========================================================
       C8 — METADATA HEADER
       Text scalars filled by the renderer. VERDICT_CLASS is one of
       verdict--ok | verdict--minor | verdict--major | verdict--blocker
       (APPROVED / APPROVED_WITH_WARNINGS / NEEDS_CHANGES / BLOCKED).
  ========================================================== -->
  <header class="report-header">
    <div class="report-meta">
      <span class="kicker">Audit profundo</span>
      <span class="report-mode">{{MODE}}</span>
      <time class="report-date" datetime="{{DATE}}">{{DATE}}</time>
    </div>
    <h1 class="report-title">{{TITLE}}</h1>
    <p class="report-subtitle">{{SUBTITLE}}</p>
    <div class="report-badges">
      <span class="verdict-badge {{VERDICT_CLASS}}">{{VERDICT}}</span>
      <span class="meta-chip"><code>{{COMMIT_SHA}}</code></span>
      <span class="meta-chip">Score {{SCORE}}/10</span>
      <span class="meta-chip">AC {{AC_COMPLIANCE}}</span>
    </div>
  </header>

  <!-- =========================================================
       TABLE OF CONTENTS (sidebar; <details> wrapper degrades to a
       collapsible block on mobile). The renderer fills {{TOC}} with
       an <ol> of <li><a href="#section-id">…</a></li>, one per
       section emitted in {{SECTIONS}} (anchors must match section ids).
  ========================================================== -->
  <details class="toc" open>
    <summary>Índice</summary>
    <p class="toc-title">Índice</p>
    <nav aria-label="Tabla de contenidos">
      {{TOC}}
    </nav>
  </details>

  <main>

    <!-- =======================================================
         EXECUTIVE SUMMARY
         Renderer fills {{EXEC_SUMMARY}}. This slot owns all
         data-driven geometry (gauge arc offset, severity-bar
         widths) because those values depend on the score/counts
         and cannot live in a flat text placeholder.

         Geometry: C1 gauge r=52, C=326.726, stroke-dashoffset =
         326.726 * (1 - score/10) (7.57 -> 79.39), stroke = the score
         threshold color. C5 severity-bar segment width % =
         count/total*100; omit zero segments. HTML comments do not
         nest, so notes live here, never inside the markup below.

         Reference markup the renderer should emit (classes are
         all defined in <style> above): HERO = C1 gauge + C5
         stat-tiles + C5 severity-bar, then the C4 "Lectura rápida"
         callout and the exec bullets/prose.

         <section id="exec" class="exec-summary">
           <h2 class="section-header" id="exec-h">
             <span class="section-num">01</span> Executive summary
             <a class="section-anchor" href="#exec-h" aria-label="Enlace">#</a>
           </h2>

           <div class="exec-hero">
             <div class="gauge" role="img" aria-label="Score 7.57 de 10">
               <svg viewBox="0 0 120 120" width="120" height="120">
                 <circle cx="60" cy="60" r="52" fill="none"
                         stroke="var(--track)" stroke-width="10"/>
                 <circle cx="60" cy="60" r="52" fill="none"
                         stroke="var(--good)" stroke-width="10"
                         stroke-linecap="round" stroke-dasharray="326.726"
                         stroke-dashoffset="79.39" transform="rotate(-90 60 60)"/>
               </svg>
               <div class="gauge-center">
                 <span class="gauge-value">7.57</span><span class="gauge-max">/10</span>
                 <span class="gauge-label">Mean score</span>
               </div>
             </div>
             <div class="exec-hero-stats">
               <ul class="stat-grid">
                 <li class="stat-tile"><span class="stat-value">8.0</span><span class="stat-label">Median</span></li>
                 <li class="stat-tile"><span class="stat-value">10</span><span class="stat-label">Findings</span></li>
                 <li class="stat-tile"><span class="stat-value">17</span><span class="stat-label">Fuentes</span></li>
                 <li class="stat-tile"><span class="stat-value">14</span><span class="stat-label">Categorías</span></li>
               </ul>
               <div>
                 <div class="sev-bar" role="img" aria-label="1 blocker, 6 major, 3 minor, 0 nit">
                   <span class="sev-seg sev--blocker" style="width:10%" title="1 BLOCKER"></span>
                   <span class="sev-seg sev--major"   style="width:60%" title="6 MAJOR"></span>
                   <span class="sev-seg sev--minor"   style="width:30%" title="3 MINOR"></span>
                 </div>
                 <ul class="sev-legend">
                   <li><span class="dot sev--blocker"></span>1 Blocker</li>
                   <li><span class="dot sev--major"></span>6 Major</li>
                   <li><span class="dot sev--minor"></span>3 Minor</li>
                   <li><span class="dot sev--nit"></span>0 Nit</li>
                 </ul>
               </div>
             </div>
           </div>

           <aside class="callout callout--note">
             <span class="callout-icon" aria-hidden="true">i</span>
             <div class="callout-body"><strong>Lectura rápida</strong>: secciones 1–3 bastan para decidir.</div>
           </aside>
           <ul> … exec bullets … </ul>
         </section>
    ========================================================== -->
    {{EXEC_SUMMARY}}

    <!-- =======================================================
         SECTIONS — the body of the report. Renderer concatenates
         one <section id="…"> per report.md section (§2 Top-10,
         §3 Quick-wins, §4 Scoring, §5 Cross, §6 Rúbrica,
         §7 Inventario, §8 Corpus, §8.5 Síntesis, §9 Limitaciones).

         Each section uses the C7 section-header pattern (id must
         match its TOC anchor):
           <section id="scoring">
             <h2 class="section-header" id="scoring-h">
               <span class="section-num">04</span> Scoring por categoría
               <a class="section-anchor" href="#scoring-h" aria-label="Enlace">#</a>
             </h2>
             … content …
           </section>

         Component cheat-sheet (all classes defined in <style>):
         · Tables (scoring 14-row, findings 10-row, quick-wins, etc.).
           A scoring row carries a score-pill (threshold: <4 bad,
           4–5.9 warn, 6–6.9 mid, >=7 good); a findings row carries the
           severity left-rule + sev-badge + a mono /flow cell:
             <div class="table-card"><table class="data-table">
               <thead><tr><th>#</th><th>Categoría</th><th class="num">Score</th><th>…</th></tr></thead>
               <tbody>
                 <tr><td class="mono">5</td><td>Critic (Phase 4)</td>
                     <td class="num"><span class="score-pill score--bad">3</span></td>
                     <td>review.md = 0 archivos; nunca ejecutado</td></tr>
                 <tr class="sev-row sev--blocker"><td class="mono">1</td>
                     <td>Phase 4 Critic nunca ejecutada</td>
                     <td><span class="sev-badge sev--blocker">BLOCKER</span></td>
                     <td class="mono">/flow --full 002</td></tr>
               </tbody>
             </table></div>
         · Top findings as cards (optional alt to table):
             <ul class="finding-grid"><li><article class="finding-card sev--blocker">…</article></li></ul>
         · Callouts (blockquotes "Techo n=1", AC5 honesty, fusión): callout--note | callout--warn | callout--info
         · Verdict words inline (Genuine / Parcial): <span class="sev-badge sev--ok">Genuine</span> /
             <span class="sev-badge sev--minor">Parcial</span>
         · AC compliance / per-category bars: .pbar-row > .pbar-name + .pbar > .pbar-fill.score--good + .pbar-num
         · Corpus bibliography: ordered lists with <a href="…"> (print expands URLs)
         · Síntesis numbered decisions: <ol> (ordered list)
    ========================================================== -->
    {{SECTIONS}}

  </main>

  <!-- =========================================================
       FOOTER
  ========================================================== -->
  <footer class="report-footer">
    Generated by Poneglyph · html-report · <code>{{COMMIT_SHA}}</code> · {{DATE}}
  </footer>

</body>
</html>
