name: Laboratory offline validation

on:
  workflow_dispatch:
  pull_request:
    paths: ['.claude/lab/**', '.github/workflows/lab.yml', 'package.json', 'bun.lock']
  push:
    branches: [main]
    paths: ['.claude/lab/**', '.github/workflows/lab.yml', 'package.json', 'bun.lock']

permissions:
  contents: read

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
        env:
          HUSKY: 0
      - name: Run simulated homes and processes only
        run: bun test ./.claude/lab/
      - name: Check laboratory types
        shell: bash
        run: bunx --package typescript@5.9.3 tsc --noEmit --strict --target ESNext --module ESNext --moduleResolution bundler --skipLibCheck --types bun --allowImportingTsExtensions .claude/lab/*.ts
